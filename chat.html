<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>与李传富对话 - ScholarMate</title>
    <link rel="icon" href="figures/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="chat-page">
    <!-- 导航栏 -->
    <header class="navbar">
        <div class="container navbar__container">
            <a href="index.html" class="navbar__logo">
                <span class="navbar__logo-icon">◉</span>
                <span class="navbar__logo-text">科研之友</span>
            </a>
            <nav class="navbar__menu">
                <a href="index.html#advisor" class="navbar__link">首页</a>
                <a href="patent-list.html" class="navbar__link">寻找专利</a>
                <a href="user-center.html#my-licenses" class="navbar__link">我的许可</a>
            </nav>
            <div class="navbar__actions">
                <a href="user-center.html" class="btn btn--outline">登录</a>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main>
        <div class="container" style="padding-top: var(--space-4);">
            <div class="chat-layout">
                <!-- 左侧：学者与会话 -->
                <aside class="chat-sidebar">
                    <div class="chat-nav-actions">
                        <a href="index.html#advisor" id="chatWorkbenchLink" class="chat-header__back">← 返回首页</a>
                        <a href="patent-detail.html" id="chatBackLink" class="chat-header__back">查看专利详情</a>
                    </div>

                    <div class="chat-inventor-info">
                        <div class="chat-inventor-info__avatar">
                            <img src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2296%22%20height%3D%2296%22%20viewBox%3D%220%200%2096%2096%22%3E%3Crect%20width%3D%2296%22%20height%3D%2296%22%20rx%3D%2218%22%20fill%3D%22%232563eb%22%2F%3E%3Ctext%20x%3D%2248%22%20y%3D%2257%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2228%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%3E%E6%9D%8E%3C%2Ftext%3E%3C%2Fsvg%3E" alt="李传富">
                        </div>
                        <div class="chat-inventor-info__name">李传富</div>
                        <div class="chat-inventor-info__badge">数字顾问</div>
                        <div class="chat-inventor-info__affiliation">合肥综合性国家科学中心人工智能研究院</div>
                        <div class="chat-inventor-info__expertise">
                            <span class="tag">人工智能</span>
                            <span class="tag">医疗影像</span>
                        </div>
                        <p class="chat-inventor-info__bio">数字顾问基于公开专利文本、首席发明人和权利人元数据生成，仅用于技术沟通原型。</p>
                    </div>

                    <div class="chat-session-panel">
                        <div class="chat-session-panel__header">
                            <span>对话会话</span>
                            <button class="btn btn--outline btn--sm" onclick="createNewSession()">新建</button>
                        </div>
                        <div class="chat-session-list" id="sessionList"></div>
                    </div>
                </aside>

                <!-- 中间：对话区域 -->
                <div class="chat-main">
                    <div class="chat-header">
                        <span class="chat-header__back">◌</span>
                        <div>
                            <div class="chat-header__title">与李传富对话</div>
                            <div class="chat-header__patent">专利：一种基于人工智能的医疗诊断系统及方法</div>
                        </div>
                        <div class="chat-header__actions">
                            <a href="index.html#advisor" id="chatWorkbenchHeaderLink" class="btn btn--outline btn--sm">返回首页</a>
                            <a href="patent-detail.html" id="chatDetailHeaderLink" class="btn btn--ghost btn--sm">查看专利详情</a>
                        </div>
                        <button class="btn btn--outline btn--sm chat-history-toggle" type="button" onclick="toggleChatSidebar()">会话</button>
                    </div>

                    <div class="chat-messages" id="chatMessages">
                        <!-- AI 欢迎消息 -->
                        <div class="chat-message chat-message--ai">
                            <div class="chat-message__avatar">
                                <img src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2296%22%20height%3D%2296%22%20viewBox%3D%220%200%2096%2096%22%3E%3Crect%20width%3D%2296%22%20height%3D%2296%22%20rx%3D%2218%22%20fill%3D%22%232563eb%22%2F%3E%3Ctext%20x%3D%2248%22%20y%3D%2257%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2228%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%3E%E6%9D%8E%3C%2Ftext%3E%3C%2Fsvg%3E" alt="李传富">
                            </div>
                            <div>
                                <div class="chat-message__content">
                                    您好！我是李传富，这款AI医疗诊断系统的发明人。很高兴您对我的专利感兴趣！您有什么想了解的吗？无论是技术细节、研发历程还是商业应用，我都很乐意为您解答。
                                </div>
                                <div class="chat-message__time">刚刚</div>
                            </div>
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <div class="chat-input-wrapper">
                            <textarea
                                class="chat-input"
                                id="chatInput"
                                placeholder="输入您的问题..."
                                rows="1"
                                onkeydown="handleKeyDown(event)"
                                oninput="autoResize(this)"
                            ></textarea>
                            <button class="chat-send-btn" id="sendBtn" onclick="sendMessage()">
                                发送
                            </button>
                        </div>
                        <div class="chat-input__meta">
                            <button class="btn btn--ghost btn--sm" id="localFallbackBtn" style="display: none; margin-left: var(--space-2);" onclick="sendLocalFallbackForLastQuestion()">本地模拟回复</button>
                        </div>
                    </div>
                </div>

                <!-- 右侧：资料源与可信边界 -->
                <aside class="chat-right-panel" aria-label="数字学者资料源与知识边界">
                    <section class="chat-trust-card chat-sources-panel">
                        <div class="chat-trust-card__header">
                            <span>资料源</span>
                            <a href="patent-detail.html" id="chatSourceDetailLink">当前专利</a>
                        </div>
                        <div class="chat-source-list" id="chatSourceList"></div>
                    </section>

                    <section class="chat-trust-card chat-boundary-panel">
                        <div class="chat-trust-card__header">
                            <span>可信边界</span>
                        </div>
                        <div class="chat-boundary-grid" id="chatBoundaryPanel"></div>
                    </section>

                    <section class="chat-trust-card chat-quick-questions">
                        <div class="chat-quick-questions__title">建议提问</div>
                        <div class="chat-quick-questions__list">
                            <button class="chat-quick-question" onclick="sendQuickQuestion('请基于专利证据说明这项技术的核心优势。')">
                                基于专利证据说明核心优势
                            </button>
                            <button class="chat-quick-question" onclick="sendQuickQuestion('这项技术落地时最需要验证哪些条件？')">
                                落地时最需要验证哪些条件？
                            </button>
                            <button class="chat-quick-question" onclick="sendQuickQuestion('哪些问题属于公开材料无法回答的范围？')">
                                哪些问题超出公开材料？
                            </button>
                        </div>
                    </section>
                </aside>
            </div>
        </div>
    </main>

    <script src="scripts/business-core.js"></script>
    <script src="scripts/semantic-search.js"></script>
    <script src="scripts/chat-sessions.js"></script>
    <script src="scripts/chat-evidence.js"></script>
    <script src="scripts/llm-client.js"></script>
    <script src="scripts/main.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const inventorId = urlParams.get('inventor') || 'inv_001';
        const patentId = urlParams.get('patent') || 'CN115062165A';
        const projectId = urlParams.get('project') || '';
        const inventor = inventors.find(i => i.id === inventorId) || inventors[0];
        const patent = getPatentById(patentId);
        const project = projectId ? UserManager.getDemandProject(projectId) : null;
        const requestedSessionId = urlParams.get('session') || '';
        const draftQuestion = urlParams.get('draft') || '';
        const chatContext = { projectId, patentId };
        let currentSession = null;
        let lastUserQuestion = '';
        const builtInPersonas = {
            inv_001: {
                scholarId: 'inv_001',
                name: inventor && inventor.name ? inventor.name : '数字学者',
                title: '医学影像 AI 数字学者',
                researchStyle: 'engineering',
                coreTopics: ['医学影像诊断', '知识图谱读片', '医学数据治理'],
                adjacentTopics: ['医院数据治理', '模型评估', '场景落地'],
                outOfScope: ['个人投资建议', '法律授权结论', '个体临床诊断'],
                tone: '产业务实',
                verbosity: 'medium',
                metaphorStyle: 'occasional',
                signaturePhrases: ['先给结论', '再说条件和风险'],
                avoidPhrases: ['保证收益', '100%无风险', '绝对准确'],
                avoidTopics: ['股票投资建议', '政治立场争论'],
                rejectionTemplates: {
                    outOfField: '这个问题超出当前学者的技术领域范围。',
                    inFieldButUntouched: '这个问题属于本领域，但现有公开材料未覆盖。',
                    beyondPublic: '这个问题需要非公开信息，超出公开回答边界。'
                },
                corePatentIds: ['CN115062165A', 'CN115512810A', 'CN114240935B']
            }
        };
        let personas = {};
        let currentPersona = null;
        let currentScholarPatents = [];

        function buildFallbackPersona() {
            const fallback = builtInPersonas[inventor.id] || builtInPersonas.inv_001;
            return Object.assign({}, fallback, {
                scholarId: inventor.id,
                name: inventor.name || fallback.name,
                title: fallback.title || `${(inventor.expertise && inventor.expertise[0]) || '技术'}数字学者`,
                coreTopics: (inventor.expertise && inventor.expertise.length) ? inventor.expertise.slice(0, 3) : fallback.coreTopics
            });
        }

        function deriveScholarPatents() {
            return patents.filter(item => item.inventorId === inventor.id);
        }

        async function loadPersonas() {
            try {
                const response = await fetch('assets/scholars/personas.json', { cache: 'no-store' });
                if (!response.ok) throw new Error(`load failed: ${response.status}`);
                const payload = await response.json();
                personas = payload && typeof payload === 'object' ? payload : {};
            } catch (error) {
                console.warn('persona asset load failed, using fallback persona', error);
                personas = {};
            }
            currentPersona = personas[inventor.id] || buildFallbackPersona();
            currentScholarPatents = deriveScholarPatents();
        }

        async function initChat() {
            await loadPersonas();
            if (!UserManager.getUser()) {
                UserManager.registerEnterprise();
            }
            ChatSessions.migrateLegacy();
            const chatGate = UserManager.canChatAboutPatent(patent.id);
            if (!chatGate.allowed) {
                document.querySelector('.chat-input').disabled = true;
                document.getElementById('sendBtn').disabled = true;
                renderWelcomeMessage();
                appendMessage('ai', `${chatGate.reason}。这一步解锁的是资料摘要、深度问答和匹配分析，不是法律意义上的专利使用授权。请先前往专利详情页处理。`, new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), false);
                setTimeout(() => {
                    window.location.href = `patent-detail.html?id=${encodeURIComponent(patent.id)}${projectId ? `&project=${encodeURIComponent(projectId)}` : ''}`;
                }, 1200);
                return;
            }
            document.title = `与${inventor.name}对话 - ScholarMate`;
            document.querySelector('.chat-header__title').textContent = `与${inventor.name}对话`;
            document.querySelector('.chat-header__patent').textContent = `专利：${patent.title}`;
            document.querySelector('.chat-inventor-info__avatar img').src = inventor.avatar;
            document.querySelector('.chat-inventor-info__avatar img').alt = inventor.name;
            document.querySelector('.chat-inventor-info__name').textContent = inventor.name;
            document.querySelector('.chat-inventor-info__affiliation').textContent = inventor.affiliation || patent.assignee || '科研之友专利库';
            document.querySelector('.chat-inventor-info__expertise').innerHTML = inventor.expertise.map(item => `<span class="tag tag--sm">${item}</span>`).join('');
            document.querySelector('.chat-inventor-info__bio').textContent = `${inventor.name}会基于公开专利文本和研究方向回答，超出公开边界的问题会直接说明。`;
            ensureCurrentSession();
            renderSessionList();
            renderTrustPanel();
            renderWelcomeMessage();
            updateTokenDisplay();
            loadConversationHistory();
            applyDraftQuestion();
            updateChatNavigationLinks();
        }

        function getPatentDetailHref() {
            return `patent-detail.html?id=${encodeURIComponent(patent.id)}${projectId ? `&project=${encodeURIComponent(projectId)}` : ''}`;
        }

        function getLastSessionQuestion() {
            if (!currentSession || !Array.isArray(currentSession.messages)) return '';
            const lastUserMessage = [...currentSession.messages].reverse().find(message => message.role === 'user' || message.role === 'human');
            return lastUserMessage ? lastUserMessage.content || '' : '';
        }

        function buildWorkbenchReturnHref(question = '') {
            const restoredQuestion = (question || lastUserQuestion || draftQuestion || getLastSessionQuestion() || '').trim();
            const params = new URLSearchParams({ mode: 'advisor' });
            if (restoredQuestion) params.set('q', restoredQuestion);
            return `index.html?${params.toString()}#advisor`;
        }

        function updateChatNavigationLinks(question = '') {
            const workbenchHref = buildWorkbenchReturnHref(question);
            const detailHref = getPatentDetailHref();
            ['chatWorkbenchLink', 'chatWorkbenchHeaderLink'].forEach(id => {
                const link = document.getElementById(id);
                if (link) link.href = workbenchHref;
            });
            ['chatBackLink', 'chatDetailHeaderLink'].forEach(id => {
                const link = document.getElementById(id);
                if (link) link.href = detailHref;
            });
            const sourceDetailLink = document.getElementById('chatSourceDetailLink');
            if (sourceDetailLink) sourceDetailLink.href = detailHref;
        }

        function ensureCurrentSession(forceNew = false) {
            if (!forceNew && requestedSessionId) {
                const existing = ChatSessions.getSession(requestedSessionId);
                if (
                    existing &&
                    existing.inventorId === inventor.id &&
                    (existing.patentId || '') === (patent.id || '') &&
                    (existing.projectId || '') === (projectId || '')
                ) {
                    currentSession = existing;
                    return currentSession;
                }
            }
            if (!forceNew) {
                currentSession = ChatSessions.listByInventor(inventor.id)
                    .find(session => session.patentId === patent.id && (session.projectId || '') === (projectId || '')) || null;
            }
            if (!currentSession) {
                currentSession = ChatSessions.createSession({
                    inventorId: inventor.id,
                    patentId: patent.id,
                    projectId,
                    provider: 'serverless-openai-compatible',
                    model: 'serverless'
                });
            }
            return currentSession;
        }

        function renderTrustPanel() {
            renderSourceList();
            renderBoundaryPanel();
        }

        function renderSourceList() {
            const list = document.getElementById('chatSourceList');
            if (!list) return;
            const sourcePatents = (currentScholarPatents.length ? currentScholarPatents : [patent]).slice(0, 6);
            list.innerHTML = sourcePatents.map(item => `
                <a class="chat-source-item ${item.id === patent.id ? 'chat-source-item--active' : ''}" href="patent-detail.html?id=${encodeURIComponent(item.id)}">
                    <span>${ScholarMate.escapeHtml(item.publicationNumber || item.id)}</span>
                    <strong>${ScholarMate.escapeHtml(item.title || '专利公开文本')}</strong>
                </a>
            `).join('');
        }

        function renderBoundaryPanel() {
            const panel = document.getElementById('chatBoundaryPanel');
            if (!panel) return;
            const coreTopics = (currentPersona && currentPersona.coreTopics && currentPersona.coreTopics.length)
                ? currentPersona.coreTopics.slice(0, 4)
                : (inventor.expertise || []).slice(0, 4);
            const outOfScope = (currentPersona && currentPersona.outOfScope && currentPersona.outOfScope.length)
                ? currentPersona.outOfScope.slice(0, 3)
                : ['法律授权结论', '个体诊疗建议', '未公开实验细节'];
            panel.innerHTML = `
                <div class="chat-boundary-block">
                    <span>能回答</span>
                    <p>${ScholarMate.escapeHtml(coreTopics.join('、') || patent.field || patent.industry || '当前专利技术方向')}</p>
                </div>
                <div class="chat-boundary-block">
                    <span>不能回答</span>
                    <p>${ScholarMate.escapeHtml(outOfScope.join('、'))}</p>
                </div>
                <div class="chat-boundary-block">
                    <span>依据来自</span>
                    <p>专利公开文本、学者公开研究方向与领域通识；涉及第一层证据时会显示依据卡片。</p>
                </div>
            `;
        }

        function renderSessionList() {
            const list = document.getElementById('sessionList');
            const sessions = ChatSessions.listByInventor(inventor.id)
                .slice(0, 10);
            if (!sessions.length) {
                list.innerHTML = '<div class="chat-session-empty">暂无会话</div>';
                return;
            }
            list.innerHTML = sessions.map(session => `
                <div class="chat-session-row">
                    <button class="chat-session-item ${currentSession && currentSession.sessionId === session.sessionId ? 'chat-session-item--active' : ''}" onclick="switchSession('${encodeURIComponent(session.sessionId)}')">
                        <span>${ScholarMate.escapeHtml(session.title)}</span>
                        <small>${new Date(session.updatedAt).toLocaleDateString('zh-CN')}</small>
                    </button>
                    <button class="chat-session-delete" type="button" onclick="deleteChatSession('${encodeURIComponent(session.sessionId)}', event)" aria-label="删除会话 ${ScholarMate.escapeHtml(session.title)}">删除</button>
                </div>
            `).join('');
        }

        function switchSession(sessionId) {
            sessionId = decodeURIComponent(sessionId);
            const session = ChatSessions.getSession(sessionId);
            if (!session) return;
            const params = new URLSearchParams({ inventor: session.inventorId, patent: session.patentId || patent.id, session: session.sessionId });
            if (session.projectId) params.set('project', session.projectId);
            window.location.href = `chat.html?${params.toString()}`;
        }

        function replaceChatSessionUrl(session) {
            history.replaceState(null, '', `chat.html?inventor=${encodeURIComponent(session.inventorId)}&patent=${encodeURIComponent(session.patentId || patent.id)}${session.projectId ? `&project=${encodeURIComponent(session.projectId)}` : ''}&session=${encodeURIComponent(session.sessionId)}`);
        }

        function deleteChatSession(sessionId, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            sessionId = decodeURIComponent(sessionId);
            if (!sessionId) return;
            if (!confirm('确定删除这条对话历史吗？')) return;
            const deletingCurrent = currentSession && currentSession.sessionId === sessionId;
            ChatSessions.clearSession(sessionId);
            if (!deletingCurrent) {
                renderSessionList();
                return;
            }
            const nextSession = ChatSessions.listByInventor(inventor.id)
                .find(session => (session.patentId || '') === (patent.id || '') && (session.projectId || '') === (projectId || ''));
            if (nextSession) {
                currentSession = nextSession;
                renderWelcomeMessage();
                loadConversationHistory();
                renderSessionList();
                updateChatNavigationLinks();
                replaceChatSessionUrl(nextSession);
                return;
            }
            createNewSession();
        }

        function createNewSession() {
            currentSession = ChatSessions.createSession({
                inventorId: inventor.id,
                patentId: patent.id,
                projectId,
                provider: 'serverless-openai-compatible',
                model: 'serverless'
            });
            renderSessionList();
            renderWelcomeMessage();
            lastUserQuestion = '';
            updateChatNavigationLinks('');
            history.replaceState(null, '', `chat.html?inventor=${encodeURIComponent(inventor.id)}&patent=${encodeURIComponent(patent.id)}${projectId ? `&project=${encodeURIComponent(projectId)}` : ''}&session=${encodeURIComponent(currentSession.sessionId)}`);
        }

        function toggleChatSidebar() {
            document.body.classList.toggle('chat-sidebar-collapsed');
        }

        function renderWelcomeMessage() {
            const container = document.getElementById('chatMessages');
            const projectLine = project ? `我已看到你的需求项目“${project.title}”，会围绕${project.industry}、${project.stage}和${project.budget}预算来判断。` : '你可以直接围绕专利证据、技术路线和落地条件提问。';
            container.innerHTML = `
                <div class="chat-message chat-message--ai">
                    <div class="chat-message__avatar">
                        <img src="${ScholarMate.escapeHtml(inventor.avatar)}" alt="${ScholarMate.escapeHtml(inventor.name)}">
                    </div>
                    <div>
                        <div class="chat-message__content">
                            您好，我是${ScholarMate.escapeHtml(inventor.name)}。${ScholarMate.escapeHtml(projectLine)}<br><br>
                            当前专利是“${ScholarMate.escapeHtml(patent.title)}”。我会优先基于专利公开文本回答；如果问题超出公开材料，我会直接说明边界。
                        </div>
                        <div class="chat-message__time">刚刚</div>
                    </div>
                </div>
            `;
        }

        function updateTokenDisplay() {
            const remaining = UserManager.getRemainingToken();
            const tokenDisplay = document.getElementById('tokenDisplay');
            if (tokenDisplay) tokenDisplay.textContent = remaining;
        }

        function loadConversationHistory() {
            if (!currentSession) ensureCurrentSession();
            (currentSession.messages || []).forEach(msg => {
                appendMessage(msg.role, msg.content, new Date(msg.time).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), false);
            });
        }

        function applyDraftQuestion() {
            if (!draftQuestion) return;
            const input = document.getElementById('chatInput');
            if (!input || input.disabled) return;
            input.value = draftQuestion;
            autoResize(input);
            input.focus();
            updateChatNavigationLinks(draftQuestion);
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message) return;

            const chatGate = UserManager.canChatAboutPatent(patent.id);
            if (!chatGate.allowed) {
                alert(chatGate.reason);
                window.location.href = `patent-detail.html?id=${encodeURIComponent(patent.id)}${projectId ? `&project=${encodeURIComponent(projectId)}` : ''}`;
                return;
            }

            if (!UserManager.consumeToken(30)) {
                alert('今日演示额度不足，请明日再试。');
                return;
            }

            lastUserQuestion = message;
            updateChatNavigationLinks(message);
            appendMessage('user', message, new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }));

            input.value = '';
            input.style.height = 'auto';
            updateTokenDisplay();
            appendMessage('ai', '\u6b63\u5728\u8c03\u7528\u670d\u52a1\u7aef\u987e\u95ee\u56de\u590d...', new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), false);
            try {
                const reply = await LlmClient.sendAdvisorChat({
                    inventorId: inventor.id,
                    patentId: patent.id,
                    project,
                    user: UserManager.getUser(),
                    history: ((currentSession && currentSession.messages) || []).slice(0, -1),
                    question: message,
                    endpoint: '/api/chat'
                });
                removeTransientThinkingMessage();
                appendMessage('ai', reply, new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), true, { provider: 'serverless-openai-compatible', model: 'serverless' });
                document.getElementById('localFallbackBtn').style.display = 'none';
            } catch (error) {
                removeTransientThinkingMessage();
                document.getElementById('localFallbackBtn').style.display = '';
                appendMessage('ai', `\u670d\u52a1\u7aef\u987e\u95ee\u6682\u65f6\u4e0d\u53ef\u7528\uff1a${LlmClient.safeErrorMessage(error)}\u3002\u53ef\u5148\u4f7f\u7528\u201c\u672c\u5730\u6a21\u62df\u56de\u590d\u201d\u7ee7\u7eed\u6f14\u793a\u3002`, new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), false);
                sendLocalFallbackForLastQuestion();
            }
        }

        function removeTransientThinkingMessage() {
            const messages = Array.from(document.querySelectorAll('.chat-message--ai .chat-message__content'));
            const thinking = messages.reverse().find(node => node.textContent.includes('\u6b63\u5728\u8c03\u7528\u670d\u52a1\u7aef\u987e\u95ee\u56de\u590d'));
            if (thinking) thinking.closest('.chat-message').remove();
        }

        function sendLocalFallbackForLastQuestion() {
            if (!lastUserQuestion) return;
            const response = ScholarMateBusinessCore.composeAdvisorReply({
                inventorName: inventor.name,
                patent,
                project,
                question: lastUserQuestion
            });
            appendMessage('ai', response, new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), true, { provider: 'local-demo', model: 'composeAdvisorReply' });
            document.getElementById('localFallbackBtn').style.display = 'none';
        }

        function sendQuickQuestion(question) {
            if (UserManager.getRemainingToken() < 30) {
                alert('今日演示额度不足，请明日再试。');
                return;
            }

            document.getElementById('chatInput').value = question;
            sendMessage();
        }

        function appendMessage(role, content, time, save = true, meta = {}) {
            const container = document.getElementById('chatMessages');
            const normalizedRole = role === 'assistant' ? 'ai' : role;
            const isAI = normalizedRole === 'ai';
            const evidence = isAI && window.ChatEvidence
                ? window.ChatEvidence.extractAssistantEvidence(content)
                : { visibleContent: content, patentIds: [] };
            const visibleContent = evidence.visibleContent || content;
            const evidenceItems = isAI && evidence.patentIds.length && window.ChatEvidence
                ? window.ChatEvidence.resolveEvidencePatents({
                    patentIds: evidence.patentIds,
                    patents: currentScholarPatents,
                    inventors
                })
                : [];

            const messageEl = document.createElement('div');
            messageEl.className = `chat-message chat-message--${normalizedRole}`;

            messageEl.innerHTML = `
                <div class="chat-message__avatar ${isAI ? '' : 'chat-message__user-avatar'}">
                    ${isAI
                        ? `<img src="${ScholarMate.escapeHtml(inventor.avatar)}" alt="${ScholarMate.escapeHtml(inventor.name)}">`
                        : '<span style="display:flex;align-items:center;justify-content:center;height:100%;font-size:16px;">👤</span>'
                    }
                </div>
                <div>
                    <div class="chat-message__content">${ScholarMate.formatMessage(visibleContent)}</div>
                    <div class="chat-message__time">${ScholarMate.escapeHtml(time)}</div>
                    ${isAI && evidenceItems.length ? renderEvidenceCard(evidenceItems) : ''}
                </div>
            `;

            container.appendChild(messageEl);
            container.scrollTop = container.scrollHeight;

            if (isAI && window.ChatEvidence) {
                window.ChatEvidence.warnPersonaBoundaryHints({
                    reply: visibleContent,
                    persona: currentPersona,
                    logger: console
                });
            }

            if (save) {
                if (!currentSession) ensureCurrentSession();
                currentSession = ChatSessions.addMessage(currentSession.sessionId, {
                    role: isAI ? 'assistant' : normalizedRole,
                    content,
                    provider: meta.provider,
                    model: meta.model
                });
                renderSessionList();
            }
        }

        function renderEvidenceCard(evidenceItems) {
            const rows = evidenceItems.map(item => `
                <li class="chat-evidence__item">
                    <a class="chat-evidence__link" href="${ScholarMate.escapeHtml(item.href)}">
                        ${ScholarMate.escapeHtml(item.title)}
                    </a>
                    <div class="chat-evidence__meta">
                        ${ScholarMate.escapeHtml(item.publicationNumber)} · ${ScholarMate.escapeHtml(item.scholarName)}
                    </div>
                </li>
            `).join('');
            return `
                <details class="chat-evidence">
                    <summary>基于 ${evidenceItems.length} 条专利</summary>
                    <ul class="chat-evidence__list">${rows}</ul>
                </details>
            `;
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        document.addEventListener('DOMContentLoaded', initChat);
    </script>
</body>
</html>
