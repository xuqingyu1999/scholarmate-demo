<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专利列表 - ScholarMate 专利交易平台</title>
    <link rel="icon" href="figures/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- 导航栏 -->
    <header class="navbar">
        <div class="container navbar__container">
            <a href="index.html" class="navbar__logo">
                <span class="navbar__logo-icon">⌕</span>
                <span class="navbar__logo-text">科研之友</span>
            </a>
            <nav class="navbar__menu">
                <a href="index.html" class="navbar__link">首页</a>
                <a href="patent-list.html" class="navbar__link navbar__link--active">寻找专利</a>
                <a href="user-center.html#my-licenses" class="navbar__link">我的许可</a>
            </nav>
            <div class="navbar__actions">
                <a href="user-center.html" class="btn btn--outline">登录</a>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="section">
        <div class="container">
            <!-- 页面标题 -->
            <div class="flex items-center justify-between mb-6">
                <h1 class="font-semibold" style="font-size: var(--font-2xl);">专利列表</h1>
                <span class="text-secondary results-count">共找到 25 件真实专利</span>
            </div>

            <!-- 搜索框 -->
            <div class="patent-list-search">
                <form action="patent-list.html" method="GET" class="patent-list-search__form">
                    <input
                        type="text"
                        name="search"
                        class="input patent-list-search__input search-input"
                        placeholder="搜索专利名称、关键词..."
                        value=""
                    >
                    <button type="submit" class="btn btn--primary">搜索</button>
                </form>
            </div>

            <!-- 横向筛选栏 -->
            <div class="patent-list-filters">
                <div class="patent-list-filter">
                    <span class="patent-list-filter__label">专利类型：</span>
                    <div class="patent-list-filter__options">
                        <button class="patent-list-filter__option patent-list-filter__option--active">全部</button>
                        <button class="patent-list-filter__option">发明专利</button>
                        <button class="patent-list-filter__option">实用新型</button>
                        <button class="patent-list-filter__option">外观设计</button>
                    </div>
                </div>
                <div class="patent-list-filter">
                    <span class="patent-list-filter__label">技术领域：</span>
                    <div class="patent-list-filter__options">
                        <button class="patent-list-filter__option patent-list-filter__option--active">全部</button>
                        <button class="patent-list-filter__option">人工智能</button>
                        <button class="patent-list-filter__option">新能源</button>
                        <button class="patent-list-filter__option">医疗健康</button>
                        <button class="patent-list-filter__option">物联网</button>
                        <button class="patent-list-filter__option">智能制造</button>
                    </div>
                </div>
                <div class="patent-list-filter">
                    <span class="patent-list-filter__label">价格区间：</span>
                    <div class="patent-list-filter__options">
                        <button class="patent-list-filter__option patent-list-filter__option--active">不限</button>
                        <button class="patent-list-filter__option">免费共享</button>
                        <button class="patent-list-filter__option">付费许可</button>
                        <button class="patent-list-filter__option">¥1,999/年</button>
                        <button class="patent-list-filter__option">¥2,999/年及以上</button>
                    </div>
                </div>
            </div>

            <!-- 排序和视图切换 -->
            <div class="flex items-center justify-between mb-4 mt-6">
                <span class="text-secondary" style="font-size: var(--font-sm);">按最新发布排序</span>
                <span class="text-secondary semantic-search-status" style="font-size: var(--font-sm);">搜索时将按自然语言相关度排序</span>
                <div class="flex gap-2">
                    <span class="tag tag--sm">Top 5</span>
                    <span class="tag tag--sm">列表视图</span>
                </div>
            </div>

            <!-- 专利列表 -->
            <div class="patent-list"></div>

    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer__grid">
                <div>
                    <h3 class="footer__title">关于我们</h3>
                    <p class="footer__text">
                        ScholarMate 是一个专业的企业端专利交易平台，致力于连接创新资源，助力企业发展。
                    </p>
                </div>
                <div>
                    <h3 class="footer__title">快速链接</h3>
                    <div class="footer__links">
                        <a href="index.html" class="footer__link">首页</a>
                        <a href="patent-list.html" class="footer__link">寻找专利</a>
                        <a href="user-center.html#my-licenses" class="footer__link">我的许可</a>
                    </div>
                </div>
                <div>
                    <h3 class="footer__title">联系方式</h3>
                    <p class="footer__text">
                        邮箱: contact@scholarmate.com<br>
                        电话: 400-123-4567
                    </p>
                </div>
            </div>
            <div class="footer__bottom">
                © 2024 ScholarMate. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="scripts/business-core.js"></script>
    <script src="scripts/semantic-search.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
