<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科研之友 - 专利与数字学者入口</title>
    <link rel="icon" href="figures/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="workbench-page">
    <div class="workbench-shell" id="workbenchShell">
        <aside class="workbench-sidebar" id="workbenchSidebar" aria-label="科研之友侧边栏">
            <div class="workbench-sidebar__head">
                <div>
                    <div class="workbench-sidebar__eyebrow">科研之友</div>
                    <strong>工作台</strong>
                </div>
                <button class="workbench-icon-btn menu-toggle" type="button" aria-label="收起侧栏" onclick="ScholarMateWorkbench.toggleSidebar(false)">×</button>
            </div>
            <div class="workbench-sidebar__body" id="workbenchSidebarBody"></div>
        </aside>
        <div class="workbench-sidebar-overlay" id="workbenchSidebarOverlay" hidden></div>

        <main class="workbench-main">
            <header class="workbench-topbar">
                <button class="workbench-icon-btn menu-toggle" id="workbenchSidebarToggle" type="button" aria-label="展开侧栏" aria-expanded="true" onclick="ScholarMateWorkbench.toggleSidebar()">
                    ☰
                </button>
                <a class="workbench-topbar__brand" href="index.html" aria-label="科研之友首页">科研之友</a>
                <button class="workbench-new-btn" id="workbenchNewButton" type="button" onclick="ScholarMateWorkbench.resetCurrentMode()">＋ 新建</button>
            </header>

            <section class="workbench-hero" aria-labelledby="workbenchTitle">
                <img class="workbench-logo workbench-logo--fallback-crop" src="scholarmate.png" data-preferred-src="scholarmate.svg" alt="科研之友">
                <h1 id="workbenchTitle">科研之友</h1>
                <p id="workbenchSlogan">用企业语言理解专利，用数字学者连接技术转化。</p>

                <div class="workbench-mode-tabs" role="tablist" aria-label="选择使用模式">
                    <button class="workbench-mode-tab workbench-mode-tab--active" id="workbenchPatentTab" type="button" role="tab" aria-selected="true" onclick="ScholarMateWorkbench.setMode('patent')">
                        <span>⌕</span>
                        寻找专利
                    </button>
                    <button class="workbench-mode-tab" id="workbenchAdvisorTab" type="button" role="tab" aria-selected="false" onclick="ScholarMateWorkbench.setMode('advisor')">
                        <span>◉</span>
                        与数字学者对话
                    </button>
                </div>

                <div class="workbench-result" id="workbenchResult" aria-live="polite"></div>
            </section>

            <form class="workbench-inputbar" id="workbenchInputForm">
                <label class="sr-only" for="workbenchInput">输入搜索或问题</label>
                <textarea id="workbenchInput" class="workbench-input" rows="1" placeholder="描述你的技术需求，例如：基层医院影像诊断效率提升"></textarea>
                <button class="workbench-submit" type="submit" aria-label="发送">发送</button>
            </form>
        </main>
    </div>

    <script src="scripts/business-core.js"></script>
    <script src="scripts/semantic-search.js"></script>
    <script src="scripts/chat-sessions.js"></script>
    <script src="scripts/llm-client.js"></script>
    <script src="scripts/main.js"></script>
    <script src="scripts/workbench.js"></script>
</body>
</html>
